<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brújula</title>
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Brújula">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111724' stroke='%238b8dff' stroke-width='2'/%3E%3Cpath d='M16 6l4 10-4 10-4-10z' fill='%238b8dff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('brujula:tema')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<style>:root{
  color-scheme:dark;
  --bg:#080b12; --bg2:#0c111b; --surface:#111724; --surface2:#182032; --line:#202a3d; --line2:#2c3850;
  --text:#eaeef7; --text2:#a9b3c8; --muted:#74809a;
  --accent:#8b8dff; --accent2:#5fb4ff;
  --ok:#0ca30c; --warn:#fab219; --bad:#d03b3b; --bad-text:#ff8585;
  --s1:#3987e5; --s3:#199e70;
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:14.5px/1.5 var(--body);color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 12% -8%,rgba(139,141,255,.20),transparent 62%),
   radial-gradient(760px 480px at 100% 8%,rgba(95,180,255,.10),transparent 65%),
   radial-gradient(700px 500px at 60% 115%,rgba(25,158,112,.08),transparent 60%)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em}
h1{font-size:30px;font-weight:700}
h2{font-size:17px;font-weight:650;margin-bottom:14px}
h3{font-size:20px;margin-bottom:10px}
a{color:var(--accent2)}
small{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* estructura */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:26px 14px 20px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(17,23,36,.7),rgba(8,11,18,.2))}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font:700 22px var(--display);letter-spacing:-.02em}
.brand svg{width:28px;height:28px;filter:drop-shadow(0 0 10px rgba(139,141,255,.7))}
#nav{display:flex;flex-direction:column;gap:3px}
#nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--text2);text-decoration:none;font-weight:550;transition:background .15s,color .15s}
#nav a svg{width:19px;height:19px;flex:none}
#nav a:hover{background:var(--surface2);color:var(--text)}
#nav a[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,rgba(139,141,255,.20),rgba(139,141,255,.04));box-shadow:inset 2px 0 0 var(--accent),0 0 24px -10px var(--accent)}
.rail-foot{margin-top:auto;padding:0 6px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);color:var(--text2);font-size:12.5px;cursor:pointer}
.pill i,.state i,.cest::before{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.pill i{display:inline-block}
.pill:hover{border-color:var(--accent)}
main{padding:30px clamp(18px,3.2vw,48px) 80px;max-width:1240px;width:100%;min-width:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthpick{position:relative;min-width:168px;text-align:center;padding:7px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line2);font-weight:600;cursor:pointer}
.monthpick:hover{border-color:var(--accent)}
.monthlabel{min-width:168px;text-align:center;font-weight:600;color:var(--text2)}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text2);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.sm{width:28px;height:28px;font-size:14px;border-radius:8px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(min(300px,100%),1fr);gap:34px;align-items:stretch;margin-bottom:6px}
.hero-main{position:relative;padding:22px 0 6px;display:flex;flex-direction:column;justify-content:flex-start}
.hero-main::before{content:"";position:absolute;left:-30px;top:-30px;width:min(520px,calc(100vw - 30px));height:260px;background:radial-gradient(closest-side,rgba(139,141,255,.20),transparent);z-index:-1;filter:blur(8px)}
.lead{margin:0;color:var(--text2);font-size:15px;font-weight:550}
.hero-num{font:700 clamp(48px,6.4vw,88px)/1 var(--display);letter-spacing:-.035em;margin:6px 0 10px;text-shadow:0 0 48px rgba(139,141,255,.45)}
.neg{color:var(--bad-text)}
.sub{margin:0 0 16px;color:var(--text2);max-width:60ch}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);box-shadow:0 0 14px -1px var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:8px}
.savepanel{padding:22px 24px;border-radius:18px;border:1px solid var(--line2);background:linear-gradient(165deg,rgba(139,141,255,.13),rgba(17,23,36,.85) 45%);box-shadow:0 24px 60px -34px rgba(139,141,255,.55)}
.save-num{font:700 clamp(32px,3.4vw,44px)/1.05 var(--display);letter-spacing:-.025em;margin:4px 0 8px}
.savepanel .sub{font-size:13px;margin-bottom:14px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.mrow.sm{border-top:0;padding:0 0 8px;margin-top:-6px;color:var(--muted);font-size:12.5px}
.mrow b{font-variant-numeric:tabular-nums;font-weight:650}
.mrow.total{border-top:1px solid var(--line2);margin-top:4px;padding-top:12px;font-size:16px}
.mrow.total b{font-size:20px;font-family:var(--display)}

/* formularios */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span,.hint{font-size:12.5px;color:var(--muted)}
.f.grow{flex:1}
input,select,.inp{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-width:0;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#55607a}
input:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,141,255,.22)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{border:1px solid var(--line2);background:var(--surface2);padding:10px 18px;border-radius:11px;font-weight:650;cursor:pointer;white-space:nowrap;transition:transform .1s,box-shadow .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{border:0;color:#0a0d18;background:linear-gradient(135deg,#9a9cff,#62a8ff);box-shadow:0 8px 28px -10px rgba(139,141,255,.9)}
.btn.primary:hover:not(:disabled){box-shadow:0 8px 34px -6px rgba(139,141,255,1)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(208,59,59,.14);border-color:rgba(208,59,59,.5);color:var(--bad-text)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.link{background:none;border:0;color:var(--accent2);font-weight:650;cursor:pointer;padding:0 0 0 12px}
.qa,.inline-form{margin:26px 0 30px;padding:18px 22px 16px;border-radius:18px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--surface),rgba(17,23,36,.6));box-shadow:0 18px 50px -34px rgba(139,141,255,.7)}
.qa h2,.inline-form h2{margin-bottom:12px}
.qa-grid{display:grid;grid-template-columns:150px 210px minmax(160px,1fr) 150px auto;gap:12px;align-items:end}
.inline-form .qa-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.qa-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:550}
.chip[aria-pressed="true"]{background:rgba(139,141,255,.2);border-color:var(--accent);color:var(--text);box-shadow:0 0 16px -4px var(--accent)}
.chk-chip{display:inline-flex;gap:6px;align-items:center}.chk-chip input{display:none}.chk-chip:has(input:checked){background:rgba(139,141,255,.2);border-color:var(--accent);color:var(--text)}
.cuota-box{display:inline-flex;gap:8px;align-items:center;margin-left:10px;color:var(--text2)}
.cuota-box input[name=cn],.cuota-box input[name=ct]{width:64px;padding:6px 8px}
.chk{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-size:13.5px;white-space:nowrap}
.chk.pad{padding-bottom:10px}
.row{display:flex;gap:12px;align-items:end}.row.wrap{flex-wrap:wrap;margin-top:12px}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filters .f{min-width:170px}.filters .f.grow{min-width:220px}
.inl{display:flex;align-items:center;gap:6px}.inl input{width:70px}

/* bloques y listas */
.block{margin-top:36px}
.crow{display:grid;grid-template-columns:minmax(150px,210px) minmax(80px,1fr) 230px 170px 170px;gap:18px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .12s}
.crow:hover{background:rgba(255,255,255,.025)}
.cname{font-weight:600}.cname em{font-weight:400;color:var(--muted)}
.cnum{font-variant-numeric:tabular-nums;white-space:nowrap}.cnum span{color:var(--muted)}
.cest{display:flex;align-items:center;gap:9px;color:var(--text2);font-size:13px}
.cest::before{content:"";display:inline-block}
.cdelta{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.cdelta.over{color:var(--bad)}
.ctotal{cursor:default;border-bottom:0;border-top:1px solid var(--line2);margin-top:4px;font-weight:650}
.ctotal:hover{background:none}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.recent li:not(:has(button)){grid-template-columns:52px 1fr auto}
.recent li.nodate{grid-template-columns:1fr auto}
.recent .t{display:flex;flex-direction:column}.recent .d{color:var(--muted);font-variant-numeric:tabular-nums}
.recent .m{font-variant-numeric:tabular-nums;font-weight:600}
.recent .none,.none{color:var(--muted);padding:14px 4px;display:block}
.recent .sumli{border-bottom:0}
.more{margin:12px 4px 0}
.note{color:var(--muted);font-size:13px;margin:8px 0 14px;max-width:80ch}
.summary{margin:2px 0 14px;color:var(--text2)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}
.hrow{display:grid;grid-template-columns:minmax(110px,170px) minmax(60px,1fr) minmax(130px,auto);gap:14px;align-items:center;padding:8px 0}
.hrow .hv{text-align:right;font-variant-numeric:tabular-nums}.hrow small{display:block}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.kpis>div{flex:1;min-width:170px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.kpis>div.strong{border-color:var(--line2);background:linear-gradient(160deg,rgba(139,141,255,.14),var(--surface))}
.kpis span{color:var(--muted);font-size:13px}.kpis b{font:700 24px var(--display);letter-spacing:-.02em}

/* tablas */
.tblwrap{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:550;color:var(--muted);font-size:12.5px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .ctr{text-align:center}.tbl .nw{white-space:nowrap;color:var(--text2)}
.tbl .act{text-align:right;white-space:nowrap}.tbl .act .icon-btn{margin-left:4px}
.tbl tr.arch td{opacity:.55}
.tbl .sumrow th,.tbl .sumrow td{font-weight:650;color:var(--text);border-top:1px solid var(--line2)}
.badge{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;font-size:11.5px;background:rgba(139,141,255,.16);color:#c4c6ff;font-weight:600}
.badge.soft{background:var(--surface2);color:var(--text2)}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:var(--bg);z-index:1}
.grid thead th{text-align:center}.grid tbody th{color:var(--text);font-weight:550;font-size:14px;padding-right:18px}
.grid td{padding:5px 4px}.grid td.cur,.grid th.cur{background:rgba(139,141,255,.07)}
.grid td.num{padding:10px 12px}
.cell{width:100px;text-align:right;padding:7px 9px;font-variant-numeric:tabular-nums;background:transparent;border-color:transparent}
.cell:hover{border-color:var(--line2)}
.cell::placeholder{color:#59647d;font-style:italic}
.metarow th em{color:var(--muted);font-weight:400}
.state{display:inline-flex;align-items:center;gap:9px;font-weight:600}.dstate small{margin-left:12px}
.steps{color:var(--text2);padding-left:20px;max-width:80ch}.steps li{margin:6px 0}

/* gráficos */
.chart{width:100%;max-width:900px;height:auto;display:block}
.chart .grid{stroke:var(--line)}.chart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.chart .tot{fill:var(--text2);font-size:11.5px;font-weight:600}
.chart rect{transition:opacity .12s}.chart rect:hover{opacity:.82}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;padding:0;color:var(--text2);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tview{margin-top:12px;color:var(--text2)}.tview summary{cursor:pointer;color:var(--accent2);font-weight:600;width:max-content}

/* varios */
.empty{max-width:560px;margin:12vh auto;text-align:center}.empty p{color:var(--text2);margin:14px 0 24px}.empty .row{justify-content:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--surface2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.7);z-index:50;max-width:min(92vw,640px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast.bad{border-color:rgba(208,59,59,.7)}
.tip{position:fixed;z-index:60;pointer-events:none;background:#0a0e17;border:1px solid var(--line2);padding:8px 11px;border-radius:9px;font-size:12.5px;opacity:0;box-shadow:0 10px 30px -10px #000;line-height:1.45}.tip.show{opacity:1}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:18px;padding:24px;width:min(92vw,460px);box-shadow:0 30px 90px -20px #000}
dialog.wide{width:min(92vw,640px)}
dialog::backdrop{background:rgba(5,7,12,.7);backdrop-filter:blur(4px)}
dialog p{color:var(--text2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.dgrid .full{grid-column:1/-1}
.dlg-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.dlg-actions .danger{margin-left:auto}

@media (max-width:1040px){
  .hero{grid-template-columns:1fr}.cols{grid-template-columns:1fr}
  .qa-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.qa-grid .grow{grid-column:1/-1}.qa-grid .btn{grid-column:1/-1}
  .crow{grid-template-columns:minmax(120px,1fr) minmax(70px,1fr) auto;row-gap:6px}.crow .cdelta,.crow .cest{grid-column:auto}
  .crow .cnum{grid-column:1/-1;order:5}
}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:12px;overflow-x:auto;gap:10px}
  #nav{flex-direction:row}#nav a span{display:none}.rail-foot{margin:0 0 0 auto}.brand span{display:none}
  main{padding-top:20px}
}
.fab{display:none}
@media (max-width:780px){
  /* botones más grandes para el dedo */
  .icon-btn.sm{width:40px;height:40px;font-size:16px}
  .tbl .act .icon-btn{margin-left:6px}
  /* Gastos: cada fila es una tarjeta (el monto siempre a la vista) */
  .tblg thead{display:none}
  .tblg,.tblg tbody{display:block}
  .tblg tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"det det mon" "fec cat act";align-items:center;column-gap:10px;row-gap:2px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tblg td{display:block;padding:0;border:0}
  .tblg .c-det{grid-area:det;font-weight:550;overflow-wrap:anywhere}
  .tblg .c-mon{grid-area:mon;font-weight:650;font-size:16px}
  .tblg .c-fec{grid-area:fec;font-size:13px}
  .tblg .c-cat{grid-area:cat;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tblg .c-act{grid-area:act}
  /* botón + para cargar un gasto desde cualquier pantalla */
  .cuota-box{flex:1 1 100%;margin-left:0}
  .tjtbl thead{display:none}
  .tjtbl,.tjtbl tbody{display:block}
  .tjtbl tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .tjtbl td{display:block;padding:0;border:0}
  .tjtbl td:first-child,.tjtbl td.num,.tjtbl td.act{grid-column:1/-1}
  .tjtbl td.num{text-align:left;color:var(--muted);font-size:13px}
  .tjtbl td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .tjtbl .inp.day{width:100%}
  .tjtbl td.act{display:flex;gap:8px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;color:#080b12;background:linear-gradient(135deg,#a3a5ff,#6aa8ff);box-shadow:0 12px 30px -8px rgba(139,141,255,.8),0 0 0 1px rgba(255,255,255,.1) inset;cursor:pointer;z-index:20}
  .fab:active{transform:scale(.95)}
  main{padding-bottom:96px}
}
/* selector de mes propio */
.mp-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.mp-head b{font-size:20px}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mp-m{padding:12px 0;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);cursor:pointer;font-weight:600}
.mp-m:hover{border-color:var(--accent)}
.mp-m.hoy{color:#c4c6ff}
.mp-m.sel{background:rgba(139,141,255,.22);border-color:var(--accent);box-shadow:0 0 16px -4px var(--accent)}
.cuota-box{flex-wrap:wrap;max-width:100%}.cuota-box .chk{white-space:normal}
input[type=date]{min-width:0;max-width:100%;display:block;height:42px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
select{height:42px}

/* Tarjetas */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.recent .acts{display:flex;gap:6px}
.tsep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.tj-box select{height:34px;padding:4px 30px 4px 12px;border-radius:99px;font-size:13px;width:auto}
.badge.tj{background:rgba(106,168,255,.16);color:#b9d6ff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;min-width:0}
.tc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.tc-head b{font-size:15px}
.tc-lab{margin:8px 0 2px;color:var(--text2);font-size:13px}
.tc-num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tc-sub{margin:2px 0 8px;color:var(--muted);font-size:12.5px}
.tcard .mrows{border-top:1px solid var(--line);padding-top:8px}
.tfs{border:1px solid var(--line2);border-radius:12px;padding:10px 14px 14px;margin:12px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tfs legend{padding:0 6px;color:var(--text2);font-size:13px}
.tjtbl .inp.day{width:70px}
.dgrid .chk.full{grid-column:1/-1;white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Cotización de hoy (Ahorros) */
.cot-hoy { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 0 0 16px; }
.cot-hoy .f { max-width: 260px; }
.cot-hoy .hint { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 260px; }
.cot-hoy .hint a { color: inherit; text-decoration: underline; }
.kpis small.hoy { display: block; margin-top: 2px; }

@media (max-width:780px){
  .tsep{display:none}
  .tgrid{gap:10px}
  .tcard{padding:10px 14px;border-radius:14px}
  .tc-head .icon-btn.sm{width:34px;height:34px}
  .tc-lab{margin:0;font-size:12.5px}
  .tc-num{font-size:22px;line-height:1.25}
  .tc-sub{margin:0 0 4px}
  .tcard .mrows{padding-top:6px}
  .tcard .mrow.sm{margin-top:0;padding-bottom:2px}
}

/* Tarjetas: totales y vencimiento cercano */
.tbox-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;margin-bottom:12px}
.tbox-head h2{margin:0}
.tbox-tot{display:flex;gap:28px;flex-wrap:wrap}
.tbox-tot span{display:flex;flex-direction:column;color:var(--muted);font-size:12.5px}
.tbox-tot b{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.tcard.urge{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset,0 0 24px -10px var(--warn)}
.tc-urge{color:var(--warn);font-weight:650}
.recent.prox .d{color:#c4c6ff}
@media (max-width:780px){ .tbox-tot{gap:18px} .tbox-tot b{font-size:17px} }

/* ===== Revisión general ===== */
.hstats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hstats>div{flex:1 1 150px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.hstats span{color:var(--muted);font-size:12.5px}
.hstats b{font:700 19px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fab{transition:opacity .18s,transform .18s}
.fab[hidden]{display:none!important}
.fab.off{opacity:0;pointer-events:none;transform:scale(.8)}
.tc-head em{font-weight:400;color:var(--muted);font-size:12px}
@media (max-width:780px){
  /* Por categoría: nombre + diferencia, barra, montos + estado */
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name delta" "bar bar" "num est";row-gap:7px;column-gap:10px}
  .crow .cname{grid-area:name}.crow .cbar{grid-area:bar}
  .crow .cnum{grid-area:num;grid-column:auto;order:0}
  .crow .cest{grid-area:est;white-space:nowrap;justify-self:end}
  .crow .cdelta{grid-area:delta}
  /* Listas de gastos en Inicio */
  .recent li:not(.nodate){grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"d t m" "d t a";row-gap:4px;align-items:start}
  .recent li:not(.nodate) .d{grid-area:d}.recent li:not(.nodate) .t{grid-area:t}
  .recent li:not(.nodate) .m{grid-area:m;text-align:right}
  .recent li:not(.nodate) .acts{grid-area:a;justify-content:flex-end}
  .recent .icon-btn.sm{width:36px;height:36px}
  /* Filtros de Gastos */
  .filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
  .filters .f{min-width:0}.filters .f:first-child,.filters .f.grow{grid-column:1/-1;min-width:0}
  .filters select,.filters input[type=search]{width:100%}
  /* Ingresos: cada ingreso es una tarjeta */
  .tbli thead,.tbla thead{display:none}
  .tbli,.tbli tbody,.tbla,.tbla tbody{display:block}
  .tbli td,.tbla td{display:block;padding:0;border:0}
  .tbli tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tipo mon" "det det" "est act";gap:6px 10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tbli .c-tipo{grid-area:tipo}.tbli .c-mon{grid-area:mon;font-weight:650;font-size:16px}
  .tbli .c-det{grid-area:det;color:var(--text2)}.tbli .c-det:empty{display:none}
  .tbli .c-est{grid-area:est;text-align:left}.tbli .c-act{grid-area:act}
  .qa-grid .chk.pad{align-self:end}
  .tbl.compact th,.tbl.compact td{padding:10px 6px;font-size:13.5px}
  /* Ahorros: cada ahorro es una tarjeta */
  .tbla tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"det det mon" "fec dest usd" "cot cot act";gap:4px 10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tbla .c-det{grid-area:det;font-weight:550;overflow-wrap:anywhere}.tbla .c-mon{grid-area:mon;font-weight:650;font-size:16px}
  .tbla .c-fec{grid-area:fec;font-size:13px}.tbla .c-dest{grid-area:dest;font-size:13px;color:var(--muted)}
  .tbla .c-usd{grid-area:usd;font-size:13px;color:var(--text2)}
  .tbla .c-cot{grid-area:cot;text-align:left;font-size:13px;color:var(--muted)}.tbla .c-cot::before{content:"Cotización "}
  .tbla .c-act{grid-area:act}
  .hstats{margin-top:16px;gap:8px}.hstats>div{flex-basis:100px;padding:10px 12px}.hstats b{font-size:16px}
}
@media (max-width:780px){
  .hrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .hrow .bar{grid-column:1/-1;order:3}
  .hrow .hv small{white-space:nowrap}
}

/* ===== Gasto dividido y fechas de tarjeta ===== */
.div-box{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text2);font-size:13.5px;max-width:100%}
.div-box input{width:54px;height:34px;padding:4px 8px;border-radius:10px;text-align:center}
.tjtbl select.inp{min-width:170px;height:38px}
.tjtbl td.ej{color:var(--text2);font-size:13px;white-space:nowrap}

/* ===== Diseño: fondo, títulos, paneles ===== */
:root{--panel:#0d121c}
body::after{content:"";position:fixed;right:-340px;top:-360px;width:1000px;height:1000px;border-radius:50%;z-index:-1;pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0 58px,rgba(139,141,255,.05) 58px 59px);
  -webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);mask-image:radial-gradient(closest-side,#000 30%,transparent 100%)}
h1{font-size:34px;letter-spacing:-.025em}
h2{font-size:18.5px;letter-spacing:-.015em}
.block{margin-top:38px}
.hero-main{padding-top:10px}
.hero-num{font-size:clamp(46px,5.6vw,80px);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-main>.bar{height:12px}
/* Día por día */
.daystrip{margin-top:22px;padding:14px 16px 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.ds-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:10px}
.ds-head b{font:650 14.5px var(--display)}.ds-head span{color:var(--muted);font-size:12.5px}
.ds-bars{display:flex;align-items:stretch;gap:3px;height:92px}
.dy{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative;border-radius:5px;cursor:default}
.dy::before{content:"";position:absolute;left:0;right:0;bottom:17px;height:2px;border-radius:2px;background:var(--line)}
.dy i{display:block;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#a9abff,#6f72e8);position:relative;margin-bottom:0;min-height:0}
.dy span{height:17px;line-height:19px;text-align:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dy.hoy i{background:linear-gradient(180deg,#fff,#c9caff);box-shadow:0 0 14px -2px #a9abff}
.dy.hoy span{color:var(--text);font-weight:700}
.dy.hoy::before{background:var(--accent)}
.dy.fut i{background:none;box-shadow:inset 0 0 0 1.5px rgba(139,141,255,.55)}
.dy:hover{background:rgba(139,141,255,.08)}
.hstats{margin-top:14px}
/* KPIs */
.kpis b{font-variant-numeric:tabular-nums}
.kpis small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis.summary{margin:4px 0 16px}
.progress{display:flex;align-items:center;gap:14px;margin:12px 0 4px;color:var(--text2);font-size:13px}
.progress .bar{flex:1 1 200px;max-width:420px}
.compo{margin:14px 0 6px}
.compo-bar{display:flex;gap:3px;height:14px}
.compo-bar i{border-radius:5px;background:linear-gradient(180deg,hsl(var(--h) 75% 68%),hsl(var(--h) 60% 52%));min-width:6px}
.compo .legend{margin-top:10px}
/* Tablas dentro de un panel */
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 10px}
.tbl thead th{font-size:12px;letter-spacing:.01em}
.tbl tbody tr:last-child td,.tbl tbody tr:last-child th{border-bottom:0}
.grid th:first-child,.grid td:first-child{background:var(--panel)}
.tbl tr.grp td{padding:16px 12px 6px;border-bottom:1px solid var(--line2);color:var(--text2);font-size:12.5px;font-weight:600}
.tbl tr.grp td b{float:right;color:var(--text);font-variant-numeric:tabular-nums;font-weight:650}
.tbl tr.grp:hover{background:none}
.tbl tr.grp:first-child td{padding-top:10px}
.tblg .c-cat{color:var(--text2);white-space:nowrap}
/* Secciones como paneles en Análisis, Ingresos y Configuración */
#main[data-view="analisis"] .block,#main[data-view="config"] .block,#main[data-view="ingresos"] .block{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px 18px;margin-top:20px}
#main[data-view="analisis"] .cols{gap:20px}
#main[data-view="analisis"] .cols .block{margin-top:20px}
.block .tblwrap{background:none;border:0;padding:0;border-radius:0}
.chart{max-width:none}
#main[data-view="analisis"] .chart{max-height:360px}
/* Tarjetas con tono propio */
.tcard{position:relative;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h,248) 70% 62%/.17),var(--surface) 58%);border-color:hsl(var(--h,248) 45% 50%/.38)}
.tcard::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;border:1px solid hsl(var(--h,248) 70% 70%/.16);box-shadow:0 0 0 22px hsl(var(--h,248) 70% 70%/.045);pointer-events:none}
.tc-head b{display:flex;align-items:center;gap:9px;min-width:0}
.tc-chip{flex:none;width:22px;height:16px;border-radius:4px;background:linear-gradient(135deg,hsl(var(--h,248) 80% 78%),hsl(var(--h,248) 60% 52%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tc-head .icon-btn{position:relative;z-index:1}
.tc-num,.tbox-tot b{font-family:var(--display)}
.recent li{transition:background .12s}.recent li:hover{background:rgba(139,141,255,.045)}
.tbl tbody tr{transition:background .12s}.tbl tbody tr:hover{background:rgba(139,141,255,.045)}
.qa,.inline-form{box-shadow:0 30px 70px -50px rgba(95,180,255,.5)}
.tjtbl select.inp,form[data-form="tj-add"] select.inp{padding-top:0;padding-bottom:0;line-height:1.2}
@media (max-width:780px){
  h1{font-size:28px}
  .hero-num{font-size:clamp(40px,12vw,52px)}
  .ds-bars{gap:2px;height:78px}.dy span{font-size:9.5px}
  .tjtbl td.ej{white-space:normal;grid-column:1/-1}
  .tjtbl select.inp{width:100%;min-width:0}
  body::after{right:-520px;top:-520px}
  .tblwrap{padding:2px 10px}
  .tblg tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"det mon" "cat act"}
  .tblg tr.grp{display:block;padding:14px 4px 6px;border-bottom:1px solid var(--line2)}
  .tblg tr.grp td{padding:0;border:0;display:flex;justify-content:space-between;gap:10px}
  .tblg tr.grp td b{float:none}
  #main[data-view="analisis"] .block,#main[data-view="config"] .block,#main[data-view="ingresos"] .block{padding:16px 14px 14px;border-radius:16px}
  .progress{flex-direction:column;align-items:stretch;gap:6px}.progress .bar{flex:none;max-width:none}
}
.kpis.summary{margin:14px 0 16px}
#main[data-view="analisis"] .cols:first-of-type .block{margin-top:6px}
@media (max-width:780px){
  .grid tbody th{max-width:112px;white-space:normal;font-size:13px;padding-right:8px;line-height:1.25}
  .grid .cell{width:82px;font-size:13.5px}
  .grid thead th{padding-left:4px;padding-right:4px}
}

/* ===== Botón de tema ===== */
.rail-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-sw{display:inline-flex;gap:2px;padding:3px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;flex:none}
.theme-sw span{display:grid;place-items:center;width:28px;height:26px;border-radius:99px;color:var(--muted);transition:background .15s,color .15s}
.theme-sw .s-luna{background:var(--accent);color:#0a0d18}
:root[data-theme="light"] .theme-sw .s-luna{background:none;color:var(--muted)}
:root[data-theme="light"] .theme-sw .s-sol{background:var(--accent);color:#fff}
.theme-sw:hover{border-color:var(--accent)}
@media (max-width:1040px){
  #nav a{padding:10px 9px}
  .rail{gap:6px}
  .rail-foot{flex-wrap:nowrap;margin-left:auto}
}
/* ===== Modo claro ===== */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f2f8; --bg2:#f6f7fb; --surface:#ffffff; --surface2:#e6e9f2; --line:#e2e5ef; --line2:#cfd5e3;
  --text:#141a2b; --text2:#434d66; --muted:#69748e;
  --accent:#5a5df0; --accent2:#2b72cf;
  --ok:#14a114; --warn:#e79f00; --bad:#d03b3b; --bad-text:#c22c2c;
  --panel:#ffffff;
}
:root[data-theme="light"] body::before{background:
   radial-gradient(900px 520px at 12% -8%,rgba(90,93,240,.16),transparent 62%),
   radial-gradient(760px 480px at 100% 8%,rgba(43,114,207,.10),transparent 65%),
   radial-gradient(700px 500px at 60% 115%,rgba(25,158,112,.07),transparent 60%)}
:root[data-theme="light"] body::after{background:repeating-radial-gradient(circle,transparent 0 58px,rgba(90,93,240,.08) 58px 59px)}
:root[data-theme="light"] .rail{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.45))}
:root[data-theme="light"] .brand svg{filter:drop-shadow(0 0 8px rgba(90,93,240,.35))}
:root[data-theme="light"] #nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(90,93,240,.16),rgba(90,93,240,.03));box-shadow:inset 2px 0 0 var(--accent)}
:root[data-theme="light"] .hero-main::before{background:radial-gradient(closest-side,rgba(90,93,240,.14),transparent)}
:root[data-theme="light"] .hero-num{text-shadow:none}
:root[data-theme="light"] .bar{box-shadow:inset 0 0 0 1px rgba(20,26,43,.04)}
:root[data-theme="light"] .bar i{box-shadow:none}
:root[data-theme="light"] .savepanel{background:linear-gradient(165deg,rgba(90,93,240,.10),#fff 45%);box-shadow:0 24px 50px -34px rgba(60,70,140,.45)}
:root[data-theme="light"] input::placeholder{color:#9aa2b6}
:root[data-theme="light"] .cell::placeholder{color:#a2aabd}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] .inp{background:#fff}
:root[data-theme="light"] .cell{background:transparent}
:root[data-theme="light"] .btn.primary,:root[data-theme="light"] .fab{color:#fff;background:linear-gradient(135deg,#6a6df3,#3c86ea);box-shadow:0 10px 24px -12px rgba(60,80,200,.8)}
:root[data-theme="light"] .btn.danger{background:rgba(208,59,59,.08)}
:root[data-theme="light"] .qa,:root[data-theme="light"] .inline-form{background:#fff;box-shadow:0 20px 44px -34px rgba(40,50,110,.45)}
:root[data-theme="light"] .chip[aria-pressed="true"],:root[data-theme="light"] .chk-chip:has(input:checked){background:rgba(90,93,240,.13);box-shadow:none}
:root[data-theme="light"] .crow:hover,:root[data-theme="light"] .tbl tbody tr:hover,:root[data-theme="light"] .recent li:hover,:root[data-theme="light"] .dy:hover{background:rgba(90,93,240,.055)}
:root[data-theme="light"] .tbl tr.grp:hover{background:none}
:root[data-theme="light"] .badge{background:rgba(90,93,240,.12);color:#4144c4}
:root[data-theme="light"] .badge.tj{background:rgba(43,114,207,.12);color:#1f5aa8}
:root[data-theme="light"] .badge.soft{background:var(--surface2);color:var(--text2)}
:root[data-theme="light"] .grid td.cur,:root[data-theme="light"] .grid th.cur{background:rgba(90,93,240,.08)}
:root[data-theme="light"] .toast{background:#fff;box-shadow:0 18px 44px -14px rgba(20,26,43,.35)}
:root[data-theme="light"] .tip{background:#fff;box-shadow:0 10px 28px -10px rgba(20,26,43,.35)}
:root[data-theme="light"] dialog{box-shadow:0 30px 80px -20px rgba(20,26,43,.45)}
:root[data-theme="light"] dialog::backdrop{background:rgba(20,26,43,.35)}
:root[data-theme="light"] .mp-m{background:#fff}
:root[data-theme="light"] .mp-m.hoy{color:var(--accent)}
:root[data-theme="light"] .mp-m.sel{background:rgba(90,93,240,.14);box-shadow:none}
:root[data-theme="light"] .kpis>div,:root[data-theme="light"] .hstats>div,:root[data-theme="light"] .tblwrap,:root[data-theme="light"] .daystrip,:root[data-theme="light"] .tcard{box-shadow:0 1px 2px rgba(20,26,43,.05),0 12px 26px -22px rgba(40,50,110,.4)}
:root[data-theme="light"] .block .tblwrap{box-shadow:none}
:root[data-theme="light"] .kpis>div.strong{background:linear-gradient(160deg,rgba(90,93,240,.12),#fff)}
:root[data-theme="light"] .dy i{background:linear-gradient(180deg,#8284f6,#5356d9)}
:root[data-theme="light"] .dy.hoy i{background:#141a2b;box-shadow:none}
:root[data-theme="light"] .dy.fut i{background:none;box-shadow:inset 0 0 0 1.5px rgba(90,93,240,.6)}
:root[data-theme="light"] .tcard{background:linear-gradient(150deg,hsl(var(--h,248) 85% 62%/.16),#fff 58%);border-color:hsl(var(--h,248) 50% 55%/.4)}
:root[data-theme="light"] .tcard.urge{border-color:var(--warn)}
:root[data-theme="light"] .tc-urge{color:#9a6500}
:root[data-theme="light"] .pill i,:root[data-theme="light"] .state i,:root[data-theme="light"] .cest::before{box-shadow:none}
:root[data-theme="light"] .icon-btn{background:#fff}
:root[data-theme="light"] .chart .tot{fill:var(--text2)}
@media (max-width:780px){
  .rail{padding:12px 10px;gap:4px}
  #nav{gap:1px}
  #nav a{padding:10px 7px}
  .brand{padding:0 4px 0 2px}
  .theme-sw span{width:26px}
}
.phead-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Gastos puntuales: aparte del presupuesto */
.punt{display:block;width:max-content;margin:4px 0 0;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:rgba(95,180,255,.14);color:#9ccbff;border:1px dashed rgba(95,180,255,.45)}
.punt-t{color:var(--text);font-weight:650}
:root[data-theme="light"] .punt{background:rgba(43,114,207,.10);color:#1f5aa8;border-color:rgba(43,114,207,.4)}
@media (max-width:780px){ .crow .cnum .punt{display:block;margin:4px 0 0;width:max-content} }
</style>
</head>
<body>

<script>'use strict';
/* ============ Utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const pad = n => String(n).padStart(2, '0');
const ymdLocal = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
// ?hoy=AAAA-MM-DD permite simular otra fecha (útil para pruebas)
const HOY = (() => { const p = new URLSearchParams(location.search).get('hoy'); return /^\d{4}-\d{2}-\d{2}$/.test(p || '') ? p : ymdLocal(new Date()); })();
const ymOf = s => s.slice(0, 7);
const addMonths = (ym, k) => { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + k; return Math.floor(t / 12) + '-' + pad(t % 12 + 1); };
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftDate = (s, k) => { const [y, m, d] = s.split('-').map(Number); const ym = addMonths(y + '-' + pad(m), k); return ym + '-' + pad(Math.min(d, daysInMonth(ym))); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return cap(MESES[m - 1]) + ' ' + y; };
const monthShort = ym => { const [y, m] = ym.split('-').map(Number); return cap(MESES_C[m - 1]) + ' ' + String(y).slice(2); };
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const thousands = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtNum = n => { if (n == null || isNaN(n)) return ''; const r = Math.round(n); return (r < 0 ? '−' : '') + thousands(Math.abs(r)); };
const fmt = n => (n == null || isNaN(n)) ? '—' : (Math.round(n) < 0 ? '−' : '') + '$' + thousands(Math.abs(Math.round(n)));
const fmtShort = n => { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + ' M'; if (a >= 1e3) return Math.round(n / 1e3) + ' mil'; return String(Math.round(n)); };
const fmtPct = (x, d = 0) => (x * 100).toFixed(d).replace('.', ',') + '%';
// Número suelto en formato argentino: 1.234,56 / 1234,56 / 1.234 / 12.5
const parseNum = str => {
  let s = String(str).trim();
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
};
// Acepta un número o una cuenta simple: 300000/6, 20000+50000, (15000+5000)*2, 1200x3
const parseMonto = str => {
  const s = String(str ?? '').replace(/[$\s]/g, '').replace(/^=/, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
  if (!s) return NaN;
  if (!/[+\-*\/()]/.test(s.replace(/^-/, ''))) return parseNum(s);
  const toks = s.match(/[\d.,]+|[+\-*\/()]|./g);
  let i = 0;
  const peek = () => toks[i];
  const expr = () => { let v = term(); while (peek() === '+' || peek() === '-') { const o = toks[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; };
  const term = () => { let v = unary(); while (peek() === '*' || peek() === '/') { const o = toks[i++]; const r = unary(); v = o === '*' ? v * r : v / r; } return v; };
  const unary = () => { if (peek() === '-') { i++; return -unary(); } if (peek() === '+') { i++; return unary(); } return atom(); };
  const atom = () => {
    const t = toks[i++];
    if (t === '(') { const v = expr(); if (toks[i++] !== ')') return NaN; return v; }
    if (t == null || !/^[\d.,]+$/.test(t)) return NaN;
    return parseNum(t);
  };
  const v = expr();
  return (i === toks.length && isFinite(v)) ? v : NaN;
};
// ¿El texto es una cuenta (y no un número solo)?
const esCuenta = str => /[+\-*\/()x×÷]/.test(String(str ?? '').replace(/[$\s]/g, '').replace(/^[-=]/, ''));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slugify = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid();

/* ============ Datos ============ */
const LS_KEY = 'brujula:v1';
const DEFAULT_CATS = ['Alquiler y servicios', 'Comida y supermercado', 'Delivery', 'Auto', 'Salud', 'Hogar', 'Planes Sofi', 'Planes Sociales', 'Entretenimiento', 'Gimnasio', 'Varios', 'Viajes'];
function emptyDB() {
  return normalizeDB({
    categorias: DEFAULT_CATS.map((n, i) => ({ id: slugify(n), nombre: n, orden: i, archivada: false })),
    etiquetas: [{ id: 'fijo', nombre: 'Fijo' }, { id: 'cuota', nombre: 'Cuota' }, { id: 'suscripcion', nombre: 'Suscripción' }]
  });
}
function normalizeDB(d) {
  d = d || {}; d.version = 1;
  d.config = Object.assign({ primerMes: ymOf(HOY), destinos: ['Balanz', 'Dólares', 'Otros'] }, d.config || {});
  for (const k of ['categorias', 'etiquetas', 'gastos', 'ingresos', 'ahorros', 'tarjetas']) d[k] = Array.isArray(d[k]) ? d[k] : [];
  d.presupuestos = d.presupuestos || {}; d.metaAhorro = d.metaAhorro || {};
  return d;
}
let DB = null;
let HAS_DATA = false; // false = primera vez, sin datos
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) return normalizeDB(JSON.parse(s)); } catch (e) { console.warn('No se pudo leer el almacenamiento local', e); } return null; }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); localStorage.setItem('brujula:dirty', '1'); return true; } catch (e) { toast('No se pudo guardar en este navegador. Exportá una copia desde Configuración.', 'bad'); return false; } }
function setDB(d, persist = true) { DB = normalizeDB(d); HAS_DATA = true; if (persist) commit(); }
function commit() { saveLocal(); Drive.queue(); }
function mutate(fn, rerender = true) { fn(); commit(); if (rerender) render(); }

/* ============ Cálculos ============ */
const catById = id => DB.categorias.find(c => c.id === id);
const catName = id => catById(id)?.nombre || '(sin categoría)';
const tagById = id => DB.etiquetas.find(t => t.id === id);
const catsOrdenadas = () => [...DB.categorias].sort((a, b) => a.orden - b.orden);

function presupuestoVigente(ym, catId) {
  let m = ym; const first = DB.config.primerMes;
  for (let i = 0; i < 240 && m >= first; i++) { const v = DB.presupuestos[m]?.[catId]; if (v != null) return v; m = addMonths(m, -1); }
  return 0;
}
function presupuestoExplicito(ym, catId) { return DB.presupuestos[ym]?.[catId]; }
function metaVigente(ym) {
  let m = ym; const first = DB.config.primerMes;
  for (let i = 0; i < 240 && m >= first; i++) { const v = DB.metaAhorro[m]; if (v != null) return v; m = addMonths(m, -1); }
  return 0;
}
const gastosDe = ym => DB.gastos.filter(g => ymOf(g.fecha) === ym);
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

const esPuntual = g => (g.etiquetas || []).includes('puntual');
function resumenMes(ym) {
  const gs = gastosDe(ym), prev = gastosDe(addMonths(ym, -1));
  const cur = ymOf(HOY);
  const cats = catsOrdenadas().filter(c => !c.archivada || gs.some(g => g.cat === c.id) || presupuestoVigente(ym, c.id) > 0);
  const rows = cats.map(c => {
    const presupuesto = presupuestoVigente(ym, c.id);
    const gastado = sumBy(gs.filter(g => g.cat === c.id), g => g.monto);
    // Los gastos con la etiqueta "Puntual" se cuentan en el gasto total pero no contra el presupuesto de la categoría
    const puntual = sumBy(gs.filter(g => g.cat === c.id && esPuntual(g)), g => g.monto), normal = gastado - puntual;
    const anterior = sumBy(prev.filter(g => g.cat === c.id), g => g.monto);
    // Meses ya cerrados: lo proyectado es lo gastado. Mes actual y futuros: el mayor entre lo normal y el presupuesto, más lo puntual.
    const proyectado = ym < cur ? gastado : Math.max(normal, presupuesto) + puntual;
    return { c, presupuesto, gastado, normal, puntual, anterior, proyectado };
  });
  const T = { presupuesto: sumBy(rows, r => r.presupuesto), gastado: sumBy(rows, r => r.gastado), normal: sumBy(rows, r => r.normal), puntual: sumBy(rows, r => r.puntual), anterior: sumBy(rows, r => r.anterior), proyectado: sumBy(rows, r => r.proyectado) };
  return { rows, T, gastos: gs };
}
function ingresosMes(ym) {
  const items = DB.ingresos.filter(i => i.mes === ym);
  const esperado = sumBy(items, i => i.monto), cobrado = sumBy(items.filter(i => i.cobrado), i => i.monto);
  return { items, esperado, cobrado, pendiente: esperado - cobrado };
}
const ahorrosDe = ym => DB.ahorros.filter(a => ymOf(a.fecha) === ym);
function situacionMes(ym) {
  const R = resumenMes(ym), I = ingresosMes(ym);
  const ahorrado = sumBy(ahorrosDe(ym), a => a.monto);
  const probable = I.esperado - R.T.proyectado;
  return { R, I, ahorrado, probable, falta: probable - ahorrado, meta: metaVigente(ym) };
}
function estadoPct(presupuesto, gastado) {
  if (!(presupuesto > 0)) return gastado > 0 ? { k: 'sin', txt: 'sin presupuesto', col: 'var(--muted)' } : { k: 'vacio', txt: 'sin movimientos', col: 'var(--muted)' };
  const p = gastado / presupuesto;
  if (p > 1) return { k: 'mal', txt: 'excedido', col: 'var(--bad)', p };
  if (p > 0.8) return { k: 'medio', txt: p >= 1 ? 'justo en el límite' : 'cerca del límite', col: 'var(--warn)', p };
  return { k: 'bien', txt: 'en rango', col: 'var(--ok)', p };
}

/* ============ Avisos, diálogos, tooltip ============ */
let toastTimer = null;
function toast(msg, kind = '', action = null) {
  const el = $('#toast');
  el.className = 'toast show ' + kind;
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" class="link" id="toast-act">${esc(action.label)}</button>` : '');
  if (action) $('#toast-act').onclick = () => { action.fn(); el.classList.remove('show'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 7000 : 3500);
}
function openDialog(html, { onSubmit, wide } = {}) {
  const d = $('#dlg');
  d.className = wide ? 'wide' : '';
  d.innerHTML = `<form method="dialog" id="dlg-form">${html}</form>`;
  const f = $('#dlg-form');
  f.addEventListener('submit', e => {
    const sub = e.submitter;
    if (sub && sub.value === 'cancel') return;
    if (onSubmit) { const keep = onSubmit(new FormData(f), sub?.value, e); if (keep === false) e.preventDefault(); }
  });
  d.showModal();
  const first = $('[autofocus], input, select', d); first && first.focus();
}
function closeDialog() { const d = $('#dlg'); if (d.open) d.close(); }
function choose(title, msg, buttons) {
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="dlg-actions">${buttons.map((b, i) => `<button class="btn ${i === 0 ? 'primary' : 'ghost'}" value="${esc(b.value)}">${esc(b.label)}</button>`).join('')}</div>`,
      { onSubmit: (_, v) => { res(v); } });
    $('#dlg').addEventListener('close', () => res('cancel'), { once: true });
  });
}
document.addEventListener('mousemove', e => {
  const t = e.target.closest?.('[data-tip]'); const tip = $('#tip');
  if (!t) { tip.classList.remove('show'); return; }
  tip.innerHTML = t.dataset.tip; tip.classList.add('show');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
  tip.style.top = Math.max(8, e.clientY - h - 12) + 'px';
});

/* ============ Descargas / exportaciones ============ */
function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const csvCell = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvNum = n => String(n ?? '').replace('.', ',');
function exportCSV(kind) {
  let head, rows;
  if (kind === 'gastos') {
    head = ['Fecha', 'Categoría', 'Detalle', 'Monto', 'Etiquetas', 'Tarjeta', 'Cuota', 'Total en tarjeta'];
    rows = [...DB.gastos].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(g => [dmy(g.fecha), catName(g.cat), g.detalle, csvNum(g.monto), (g.etiquetas || []).map(t => tagById(t)?.nombre || t).join(', '), g.tarjeta ? tarjetaNombre(g.tarjeta) : '', g.cuota?.n ? g.cuota.n + '/' + g.cuota.total : '', g.montoTj > 0 ? g.montoTj : '']);
  } else if (kind === 'ingresos') {
    head = ['Mes', 'Tipo', 'Descripción', 'Monto', 'Cobrado'];
    rows = [...DB.ingresos].sort((a, b) => a.mes.localeCompare(b.mes)).map(i => [i.mes, i.tipo, i.desc, csvNum(i.monto), i.cobrado ? 'Sí' : 'No']);
  } else {
    head = ['Fecha', 'Destino', 'Detalle', 'Monto ($)', 'Cotización USD', 'Monto USD'];
    rows = [...DB.ahorros].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(a => [dmy(a.fecha), a.destino, a.detalle, csvNum(a.monto), csvNum(a.cotizacion), a.cotizacion > 0 ? csvNum((a.monto / a.cotizacion).toFixed(2)) : '']);
  }
  const text = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n');
  download(`brujula-${kind}.csv`, text, 'text/csv;charset=utf-8');
}

/* ============ Google Drive (archivo JSON propio en tu Drive) ============ */
const DRIVE_FILE = 'brujula-datos.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const Drive = {
  clientId: (() => { try { return localStorage.getItem('brujula:clientId') || ''; } catch (e) { return ''; } })(),
  fileId: (() => { try { return localStorage.getItem('brujula:fileId') || ''; } catch (e) { return ''; } })(),
  wasConnected: (() => { try { return localStorage.getItem('brujula:drive') === '1'; } catch (e) { return false; } })(),
  token: null, exp: 0, tc: null, timer: null, saving: false,
  status: 'local', // local | conectando | ok | guardando | reconectar | error
  msg: '',
  lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  setStatus(s, msg = '') { this.status = s; this.msg = msg; const p = $('#pill'); if (p) renderPill(); const st = $('#drive-state'); if (st) st.innerHTML = driveStateHtml(); },
  init() { if (this.wasConnected && this.clientId) this.setStatus('reconectar', 'Hacé clic para reconectar con Drive'); },
  validToken() { return this.token && Date.now() < this.exp; },
  async loadGIS() {
    if (window.google?.accounts?.oauth2) return;
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el inicio de sesión de Google. Revisá tu conexión.')); document.head.appendChild(s); });
  },
  async getToken(prompt = '') {
    await this.loadGIS();
    return new Promise((resolve, reject) => {
      if (!this.tc) this.tc = google.accounts.oauth2.initTokenClient({ client_id: this.clientId, scope: DRIVE_SCOPE, callback: () => { } });
      this.tc.callback = r => { if (r.error) reject(new Error(r.error_description || r.error)); else { this.token = r.access_token; this.exp = Date.now() + ((r.expires_in || 3600) - 60) * 1000; resolve(r.access_token); } };
      this.tc.error_callback = e => reject(new Error(e?.type === 'popup_closed' ? 'Cerraste la ventana de Google antes de terminar.' : (e?.message || e?.type || 'No se pudo iniciar sesión')));
      this.tc.requestAccessToken({ prompt });
    });
  },
  async api(url, opts = {}) {
    const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + this.token }, opts.headers || {}) }));
    if (r.status === 401) { this.token = null; throw Object.assign(new Error('auth'), { auth: true }); }
    if (!r.ok) throw new Error('Drive respondió ' + r.status + ': ' + (await r.text()).slice(0, 200));
    return r;
  },
  async find() {
    const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive&pageSize=10`);
    const j = await r.json(); return (j.files || [])[0] || null;
  },
  async read(id) { const r = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); return normalizeDB(await r.json()); },
  async create(json) {
    const b = 'brujula' + Date.now();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${b}--`;
    const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
    return r.json();
  },
  async update(id, json) {
    const r = await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,modifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: json });
    return r.json();
  },
  async connect() {
    if (!this.clientId) { toast('Primero pegá tu ID de cliente de Google en Configuración.', 'bad'); return; }
    this.setStatus('conectando', 'Conectando con Google…');
    try {
      await this.getToken(this.wasConnected ? '' : 'consent');
      const f = await this.find();
      const dirty = localStorage.getItem('brujula:dirty') === '1';
      const lastMod = localStorage.getItem('brujula:remoteMod') || '';
      const localHas = !!(DB && (DB.gastos.length || DB.ingresos.length || DB.ahorros.length));
      if (f) {
        this.fileId = f.id; this.lsSet('brujula:fileId', f.id);
        let usar = 'none', mod = f.modifiedTime;
        if (f.modifiedTime === lastMod) usar = dirty ? 'local' : 'none'; // Drive no cambió desde la última sincronización
        else {
          const remote = await this.read(f.id);
          const remoteHas = !!(remote.gastos.length || remote.ingresos.length || remote.ahorros.length);
          if (JSON.stringify(remote) === JSON.stringify(DB)) usar = 'none';
          else if (!localHas) usar = 'drive';
          else if (!remoteHas) usar = 'local';
          else if (!dirty) usar = 'drive';
          else usar = await choose('Hay datos distintos', `En Drive hay un archivo (modificado ${new Date(f.modifiedTime).toLocaleString('es-AR')}) y este navegador tiene cambios que todavía no se subieron. ¿Cuál querés conservar?`,
            [{ label: 'Usar los de Drive', value: 'drive' }, { label: 'Subir los de este navegador', value: 'local' }, { label: 'Cancelar', value: 'cancel' }]);
          if (usar === 'drive') { DB = remote; HAS_DATA = true; try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { } }
        }
        if (usar === 'cancel') { this.setStatus('local', 'Conexión cancelada'); return; }
        if (usar === 'local') { const u = await this.update(f.id, JSON.stringify(DB)); mod = u.modifiedTime || mod; }
        this.lsSet('brujula:remoteMod', mod || '');
      } else {
        const created = await this.create(JSON.stringify(DB || emptyDB()));
        this.fileId = created.id; this.lsSet('brujula:fileId', created.id); this.lsSet('brujula:remoteMod', created.modifiedTime || '');
      }
      this.wasConnected = true; this.lsSet('brujula:drive', '1'); this.lsSet('brujula:dirty', '0');
      this.setStatus('ok', 'Guardado en tu Drive'); render(); toast('Conectado con Google Drive.');
    } catch (e) {
      console.error(e);
      this.setStatus('error', e.message || String(e)); toast('No se pudo conectar: ' + (e.message || e), 'bad');
    }
  },
  disconnect() {
    this.token = null; this.exp = 0; this.wasConnected = false; this.fileId = '';
    this.lsSet('brujula:drive', '0'); this.lsSet('brujula:fileId', '');
    this.setStatus('local', 'Datos solo en este navegador'); toast('Desconectado de Drive. Tus datos siguen en este navegador.');
  },
  queue() {
    if (!this.wasConnected || !this.clientId || !this.fileId) return;
    if (this.status === 'reconectar' || this.status === 'conectando') return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200);
    this.setStatus('guardando', 'Guardando…');
  },
  async flush() {
    if (!this.validToken()) { this.setStatus('reconectar', 'Sesión de Drive vencida: reconectá para seguir sincronizando'); return; }
    try { const u = await this.update(this.fileId, JSON.stringify(DB)); this.lsSet('brujula:remoteMod', u.modifiedTime || ''); this.lsSet('brujula:dirty', '0'); this.setStatus('ok', 'Guardado en tu Drive'); }
    catch (e) { if (e.auth) this.setStatus('reconectar', 'Sesión de Drive vencida: reconectá para seguir sincronizando'); else { this.setStatus('error', e.message); toast('No se pudo guardar en Drive. Los datos están a salvo en este navegador.', 'bad'); } }
  }
};
function renderPill() {
  const p = $('#pill'); if (!p) return;
  const map = {
    local: ['var(--muted)', 'Solo en este navegador'], conectando: ['var(--warn)', 'Conectando…'], ok: ['var(--ok)', 'Drive al día'],
    guardando: ['var(--warn)', 'Guardando…'], reconectar: ['var(--warn)', 'Reconectar Drive'], error: ['var(--bad)', 'Error de Drive']

}

const DIAS_SEM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

function diasHtml(ym, gastos) {
  const n = daysInMonth(ym), cur = ymOf(HOY), hoyD = ym === cur ? Number(HOY.slice(8)) : (ym < cur ? n + 1 : 0);
  const tot = Array(n).fill(0), cnt = Array(n).fill(0);
  gastos.forEach(g => { const d = Number(g.fecha.slice(8)) - 1; if (d >= 0 && d < n) { tot[d] += g.monto; cnt[d]++; } });
  const max = Math.max(...tot, 1), imax = tot.indexOf(Math.max(...tot));
  const marcas = new Set([1, 5, 10, 15, 20, 25, n]);
  const bars = tot.map((v, i) => { const d = i + 1, f = ym + '-' + pad(d), k = d === hoyD ? 'hoy' : d > hoyD ? 'fut' : 'pas';
    return `<div class="dy ${k}" data-tip="<b>${cap(diaSemana(f))} ${d}</b><br>${v ? fmt(v) + ' en ' + plural(cnt[i], 'gasto') : 'Sin gastos'}${k === 'fut' && v ? '<br>Ya cargado, todavía no pasó' : ''}"><i style="height:${v ? Math.max(6, v / max * 100) : 0}%"></i><span>${marcas.has(d) || d === hoyD ? d : ''}</span></div>`; }).join('');
  return `<div class="daystrip"><div class="ds-head"><b>Día por día</b><span>${tot[imax] > 0 ? `El día más cargado fue el ${imax + 1}: ${fmt(tot[imax])}` : 'Todavía sin gastos'}</span></div><div class="ds-bars" role="img" aria-label="Gasto de cada día del mes">${bars}</div></div>`;
}

      }

/* ============ Tarjetas de crédito ============ */
// Cada tarjeta: { id, nombre, cierre: día, vence: día, ajustes: { 'AAAA-MM': { cierre: 'AAAA-MM-DD', vence: 'AAAA-MM-DD' } } }
// Un "resumen" se identifica por el mes en que cierra.
// Lo que un gasto suma en la tarjeta: el total pagado (si lo dividís con alguien) o el monto
const enTarjeta = g => (g.montoTj > 0 ? g.montoTj : g.monto);

const tarjetaById = id => (DB.tarjetas || []).find(t => t.id === id);
const tarjetaNombre = id => tarjetaById(id)?.nombre || '';
const mesesEntre = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const diaEn = (ym, d) => ym + '-' + pad(Math.min(d, daysInMonth(ym)));

// ¿El vencimiento cae en el mes siguiente al del cierre? Si la tarjeta no lo tiene definido, se deduce de los días.
const venceMesSig = (t, cierre) => t.venceSig != null ? !!t.venceSig : !(t.vence > Number((cierre || diaEn(ymOf(HOY), t.cierre)).slice(8)));
const ejemploFechas = t => { const R = fechasResumen(t, ymOf(HOY), false); return `cierra el ${dm(R.cierre)} y vence el ${dm(R.vence)}`; };
function fechasResumen(t, ym, conAjustes = true) {
  const aj = (conAjustes && t.ajustes?.[ym]) || {};
  const cierre = aj.cierre || diaEn(ym, t.cierre);
  let vence = aj.vence;
  if (!vence) { const vm = venceMesSig(t, cierre) ? addMonths(ymOf(cierre), 1) : ymOf(cierre); vence = diaEn(vm, t.vence); }
  return { ym, cierre, vence };
}
// Mes del resumen en el que entra un gasto hecho en esa fecha
function resumenDeFecha(t, fecha) {
  let ym = addMonths(ymOf(fecha), -1);
  for (let i = 0; i < 4; i++) { if (fecha <= fechasResumen(t, ym).cierre) return ym; ym = addMonths(ym, 1); }
  return ym;
}
// Un gasto en cuotas entra una cuota por resumen: se cuenta desde el resumen de la primera cuota cargada
// (así no se juntan dos cuotas en un mismo resumen si un mes cambia la fecha de cierre).
function resumenDeGasto(t, g) {
  if (!g.cuota?.grupo || !g.cuota.n) return resumenDeFecha(t, g.fecha);
  const hs = DB.gastos.filter(x => x.tarjeta === t.id && x.cuota?.grupo === g.cuota.grupo && x.cuota.total === g.cuota.total && x.cuota.n && mesesEntre(ymOf(g.fecha), ymOf(x.fecha)) === x.cuota.n - g.cuota.n);
  const first = hs.reduce((a, b) => (b.cuota.n < a.cuota.n ? b : a), g);
  return addMonths(resumenDeFecha(t, first.fecha), g.cuota.n - first.cuota.n);
}
function estadoTarjeta(t) {
  // Próximo resumen a pagar: el primero cuyo vencimiento todavía no pasó
  let ym = addMonths(ymOf(HOY), -2), R = null;
  for (let i = 0; i < 8; i++) { R = fechasResumen(t, ym); if (R.vence >= HOY) break; ym = addMonths(ym, 1); }
  const porRes = {}, ajeno = {};
  DB.gastos.filter(g => g.tarjeta === t.id).forEach(g => { const r = resumenDeGasto(t, g); porRes[r] = (porRes[r] || 0) + enTarjeta(g); ajeno[r] = (ajeno[r] || 0) + (enTarjeta(g) - g.monto); });
  const prox = { ...R, monto: porRes[R.ym] || 0, ajeno: ajeno[R.ym] || 0, cerrado: HOY > R.cierre };
  const sig = prox.cerrado ? (R2 => ({ ...R2, monto: porRes[R2.ym] || 0, ajeno: ajeno[R2.ym] || 0 }))(fechasResumen(t, addMonths(R.ym, 1))) : null;
  const ultimo = sig ? sig.ym : prox.ym;
  const futuro = sumBy(Object.entries(porRes).filter(([k]) => k > ultimo), ([, v]) => v);
  return { prox, sig, futuro };
}

/* ============ Cuotas ============ */
// Cuotas de la misma compra: mismo grupo, mismo total y fechas coherentes con el número de cuota
function cuotasHermanas(g) {
  if (!g.cuota?.grupo || !g.cuota.n || !g.cuota.total) return [g];
  const base = ymOf(g.fecha);
  return DB.gastos.filter(x => x === g || (x.cuota?.grupo === g.cuota.grupo && x.cuota.total === g.cuota.total && x.cuota.n && mesesEntre(base, ymOf(x.fecha)) === x.cuota.n - g.cuota.n));
}
const nuevoGrupo = detalle => slugify(detalle.replace(/\d+\/\d+|cuotas?/gi, '')) + '-' + uid().slice(-5);
// Crea las cuotas que faltan después de g (sin duplicar las que ya existen). Devuelve las nuevas.
function generarCuotasFaltantes(g) {
  const { n, total, grupo } = g.cuota || {};
  if (!n || !total || n >= total) return [];
  const existentes = new Set(cuotasHermanas(g).map(x => x.cuota.n));
  const nuevos = [];
  for (let k = n + 1; k <= total; k++) {
    if (existentes.has(k)) continue;
    const x = { id: uid(), fecha: shiftDate(g.fecha, k - n), cat: g.cat, detalle: /\d+\/\d+/.test(g.detalle) ? g.detalle.replace(/\d+\/\d+/, `${k}/${total}`) : g.detalle, monto: g.monto, etiquetas: [...(g.etiquetas || [])], cuota: { n: k, total, grupo } };
    if (g.tarjeta) x.tarjeta = g.tarjeta;
    if (g.montoTj > 0) x.montoTj = g.montoTj;
    nuevos.push(x);
  }
  return nuevos;
}

function eliminarGasto(id) {
  const g = DB.gastos.find(x => x.id === id); if (!g) return;
  const hs = cuotasHermanas(g);
  if (hs.length <= 1) return borrarGastos([g], `Gasto eliminado: ${g.detalle}`);
  const sig = hs.filter(x => x.cuota.n >= g.cuota.n);
  const opts = [{ label: 'Solo esta cuota', value: 'una' }];
  if (sig.length > 1 && sig.length < hs.length) opts.push({ label: `Esta y las siguientes (${sig.length})`, value: 'sig' });
  opts.push({ label: `Todas las cuotas (${hs.length})`, value: 'todas' }, { label: 'Cancelar', value: 'cancel' });
  choose('¿Qué cuotas borro?', `«${g.detalle}» es la cuota ${g.cuota.n} de ${g.cuota.total}. Hay ${hs.length} cuotas de esta compra cargadas.`, opts).then(v => {
    if (v === 'una') borrarGastos([g], `Cuota eliminada: ${g.detalle}`);
    else if (v === 'sig') borrarGastos(sig, `${sig.length} cuotas eliminadas`);
    else if (v === 'todas') borrarGastos(hs, `${hs.length} cuotas eliminadas`);
  });
}
function borrarGastos(lista, msg) {
  const set = new Set(lista);
  const quitados = DB.gastos.map((g, i) => [g, i]).filter(([g]) => set.has(g));
  mutate(() => { DB.gastos = DB.gastos.filter(g => !set.has(g)); });
  toast(msg, '', { label: 'Deshacer', fn: () => mutate(() => { quitados.forEach(([g, i]) => DB.gastos.splice(Math.min(i, DB.gastos.length), 0, g)); }) });
}

    ingresos: { esperado: r2(I.esperado), cobrado: r2(I.cobrado), faltaCobrar: r2(I.pendiente), detalle: I.items.map(i => ({ tipo: TIPOS[i.tipo] || i.tipo, descripcion: i.desc || '', monto: r2(i.monto), cobrado: !!i.cobrado })) },
    resumen: { gastoTotal: r2(R.T.gastado), gastoPuntual: r2(R.T.puntual), gastoSinPuntuales: r2(R.T.normal), presupuestoTotal: r2(R.T.presupuesto), pctDelIngresoGastado: pct(R.T.gastado, ing), gastoProyectadoSegunPresupuesto: r2(R.T.proyectado), ahorroProbable: r2(S.probable), ahorradoEnElMes: r2(S.ahorrado), metaDeAhorro: r2(S.meta), cantidadDeGastos: R.gastos.length },
    porCategoria,

    historial: [...prev].reverse().concat(ym).map(m => ({ mes: m, ingresos: r2(ingresosMes(m).esperado), gastos: r2(sumBy(gastosDe(m), g => g.monto)), ahorro: r2(sumBy(ahorrosDe(m), a => a.monto)) })),

}

const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#9085e9', '#e66767'];
const RESTO = '#74809a';
function niceScale(v) {
  const raw = Math.max(v, 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { step, max: step * Math.ceil(Math.max(v, 1) / step) };
}
function ventana() {
  const first = DB.gastos.length ? ymOf(DB.gastos.reduce((m, g) => g.fecha < m ? g.fecha : m, '9999-99-99')) : UI.month;
  const ms = []; let m = UI.month;
  for (let i = 0; i < 6 && m >= first; i++) { ms.unshift(m); m = addMonths(m, -1); }
  return ms.length ? ms : [UI.month];
}
const chartW = () => (window.innerWidth < 780 ? 380 : 640);
const mesEje = (m, n) => chartW() < 500 ? (n > 6 ? monthShort(m).slice(0, 3) : monthShort(m)) : monthShort(m) + (m === ymOf(HOY) ? ' (en curso)' : '');
function svgFrame(inner, W, H) { return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">${inner}</svg>`; }
function axes(L, R, T, W, ph, max, step) {
  let g = ''; for (let t = 0; t <= max + 1e-6; t += step) { const y = T + ph - t / max * ph; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 8}" y="${y + 4}" class="ax" text-anchor="end">${t === 0 ? '0' : fmtShort(t)}</text>`; }
  return g;
}
function chartStack(months) {
  const totalCat = {};
  months.forEach(m => gastosDe(m).forEach(g => totalCat[g.cat] = (totalCat[g.cat] || 0) + g.monto));
  const ids = Object.keys(totalCat).sort((a, b) => totalCat[b] - totalCat[a]);
  const top = ids.slice(0, SERIES.length), rest = ids.slice(SERIES.length);
  const series = top.map((id, k) => ({ name: catName(id), color: SERIES[k], v: months.map(m => sumBy(gastosDe(m).filter(g => g.cat === id), g => g.monto)) }));
  if (rest.length) series.push({ name: 'Resto de categorías', color: RESTO, v: months.map(m => sumBy(gastosDe(m).filter(g => rest.includes(g.cat)), g => g.monto)) });
  const W = chartW(), H = 300, L = 54, R = 10, T = 22, B = 30, pw = W - L - R, ph = H - T - B;
  const totals = months.map((_, i) => series.reduce((s, x) => s + x.v[i], 0));
  const { max, step } = niceScale(Math.max(...totals, 1)), y = v => T + ph - v / max * ph;
  let g = axes(L, R, T, W, ph, max, step);
  const bw = Math.min(76, pw / months.length * 0.55);
  months.forEach((m, i) => {
    const cx = L + pw / months.length * (i + 0.5); let acc = 0;
    series.forEach(s => {
      const v = s.v[i]; if (v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v); acc += v;
      g += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" rx="3" fill="${s.color}" stroke="var(--surface)" stroke-width="2" data-tip="<b>${esc(s.name)}</b><br>${monthShort(m)}: ${fmt(v)} (${fmtPct(v / totals[i])})"/>`;
    });
    g += `<text x="${cx}" y="${y(totals[i]) - 6}" class="tot" text-anchor="middle">${fmtShort(totals[i])}</text><text x="${cx}" y="${H - 8}" class="ax" text-anchor="middle">${mesEje(m, months.length)}</text>`;
  });
  const legend = `<ul class="legend">${series.map(s => `<li><i style="background:${s.color}"></i>${esc(s.name)}</li>`).join('')}</ul>`;

function chartFlujo(months) {

  const sr = [['Ingresos', '#3987e5', 'ing'], ['Gastos', '#d95926', 'gas'], ['Ahorro', '#199e70', 'aho']];
  const W = chartW(), H = 280, L = 54, R = 10, T = 22, B = 30, pw = W - L - R, ph = H - T - B;
  const { max, step } = niceScale(Math.max(...data.flatMap(d => [d.ing, d.gas, d.aho]), 1)), y = v => T + ph - v / max * ph;
  let g = axes(L, R, T, W, ph, max, step);
  const gw = pw / data.length, bw = Math.min(30, gw * 0.24);
  data.forEach((d, i) => {
    const cx = L + gw * (i + 0.5);
    sr.forEach(([n, col, k], j) => {
      const v = d[k], x = cx + (j - 1) * (bw + 3) - bw / 2, yy = y(v);
      if (v > 0) g += `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0, y(0) - yy)}" rx="3" fill="${col}" data-tip="<b>${n}</b><br>${monthShort(d.m)}: ${fmt(v)}"/>`;
    });

  });
  const legend = `<ul class="legend">${sr.map(([n, c]) => `<li><i style="background:${c}"></i>${n}</li>`).join('')}</ul>`;
  const table = `<details class="tview"><summary>Ver como tabla</summary><div class="tblwrap"><table class="tbl"><thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Gastos</th><th class="num">Ahorro</th></tr></thead><tbody>${data.map(d => `<tr><td>${monthLabel(d.m)}</td><td class="num">${fmt(d.ing)}</td><td class="num">${fmt(d.gas)}</td><td class="num">${fmt(d.aho)}</td></tr>`).join('')}</tbody></table></div></details>`;

function irACarga() {
  const ya = UI.view === 'inicio';
  if (!ya) go('inicio');
  setTimeout(() => { const f = $('form[data-form="qa"]'); if (f) f.scrollIntoView({ block: 'start', behavior: 'smooth' }); const el = $('#qa-detalle'); el && el.focus({ preventScroll: true }); }, ya ? 0 : 150);
}
function focusQA(sel = '#qa-detalle') { requestAnimationFrame(() => { const el = $(sel); el && el.focus(); }); }
function submitQA(form) {
  const fd = new FormData(form);
  const fecha = fd.get('fecha'), cat = fd.get('cat'), detalle = (fd.get('detalle') || '').trim(), total = parseMonto(fd.get('monto'));
  const divN = UI.qa.div ? parseInt(fd.get('divn')) : 1;
  if (UI.qa.div && !(divN >= 2 && divN <= 50)) { toast('Decime entre cuántos lo dividís (2 o más).', 'bad'); form.divn?.focus(); return; }
  const monto = Math.round(total / divN * 100) / 100;
  if (!fecha) { toast('Falta la fecha.', 'bad'); return; }
  if (!cat) { toast('Elegí una categoría.', 'bad'); form.cat.focus(); return; }
  if (!detalle) { toast('Escribí un detalle.', 'bad'); $('#qa-detalle').focus(); return; }
  if (!(monto > 0)) { toast('El monto tiene que ser un número mayor a cero.', 'bad'); $('#qa-monto').focus(); return; }
  const tags = [...UI.qa.tags];
  const tj = UI.qa.conTj ? (fd.get('tj') || '') : '';
  if (UI.qa.conTj && !tj) { toast('Marcaste «Con tarjeta» pero no tenés tarjetas cargadas. Agregalas en Configuración.', 'bad'); return; }
  const g = { id: uid(), fecha, cat, detalle, monto, etiquetas: tags };
  if (tj) g.tarjeta = tj;
  if (tj && divN > 1) g.montoTj = total;
  const nuevos = [g];
  if (tags.includes('cuota')) {
    const cn = parseInt(fd.get('cn')), ct = parseInt(fd.get('ct')), grupo = nuevoGrupo(detalle);
    g.cuota = (cn && ct) ? { n: cn, total: ct, grupo } : { n: null, total: null, grupo };
    if (cn && ct && cn < ct && fd.get('gen')) {
      for (let k = 1; k <= ct - cn; k++) {
        const n = cn + k;
        nuevos.push({ id: uid(), fecha: shiftDate(fecha, k), cat, detalle: /\d+\/\d+/.test(detalle) ? detalle.replace(/\d+\/\d+/, `${n}/${ct}`) : detalle, monto, etiquetas: [...tags], cuota: { n, total: ct, grupo }, ...(tj ? { tarjeta: tj } : {}), ...(g.montoTj ? { montoTj: g.montoTj } : {}) });
      }
    }
  }
  Object.assign(UI.qa, { fecha, cat, tags: [], d: '', m: '', ph: '', conTj: false, cn: '', ct: '', gen: true, div: false, divN: '2' });
  if (tj) DB.config.ultTarjeta = tj;
  mutate(() => DB.gastos.push(...nuevos));
  const ids = nuevos.map(x => x.id), otroMes = ymOf(fecha) !== UI.month;
  toast(`Guardado: ${detalle} · ${fmt(monto)}${divN > 1 ? ' (tu parte de ' + fmt(total) + ')' : ''}${tj ? ' · 💳 ' + tarjetaNombre(tj) : ''}${nuevos.length > 1 ? ` (y ${nuevos.length - 1} cuotas siguientes)` : ''}${otroMes ? ` · quedó en ${monthLabel(ymOf(fecha))}` : ''}`, '',
    { label: 'Deshacer', fn: () => mutate(() => { DB.gastos = DB.gastos.filter(x => !ids.includes(x.id)); }) });

}
