  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'month-prev': UI.month = addMonths(UI.month, -1); render(); break;
    case 'month-next': UI.month = addMonths(UI.month, 1); render(); break;
    case 'month-pick': mesDialog(+UI.month.slice(0, 4)); break;
    case 'mp-year': mesDialog(+el.dataset.y); break;
    case 'mp-set': UI.month = el.dataset.ym; closeDialog(); render(); break;
    case 'go-config': go('config'); break;
    case 'go-cat': UI.g = { cat: id, tag: '', q: '', all: false }; go('gastos'); break;
    case 'go-gastos-mes': e.preventDefault(); UI.g = { cat: '', tag: '', q: '', all: false }; go('gastos'); break;
    case 'qa-tag': { snapQA(); const t = UI.qa.tags; const k = t.indexOf(id); k >= 0 ? t.splice(k, 1) : t.push(id); render(); refocus = { sel: `.qa .chip[data-id="${id}"]`, pos: 0 }; $(refocus.sel)?.focus(); refocus = null; break; }
    case 'qa-ir': irACarga(); break;
    case 'qa-tj': {
      if (!tarjetasActivas().length) { toast('Primero cargá tus tarjetas en Configuración.', 'bad', { label: 'Ir a Configuración', fn: () => go('config') }); break; }
      snapQA(); UI.qa.conTj = !UI.qa.conTj; render(); $('.qa .chip[data-act="qa-tj"]')?.focus(); break;
    }
    case 'tema': setTema(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); break;
    case 'qa-div': snapQA(); UI.qa.div = !UI.qa.div; render(); (UI.qa.div ? $('.qa input[name="divn"]') : $('.qa .chip[data-act="qa-div"]'))?.focus(); break;
    case 'tj-fechas': tarjetaFechasDialog(id); break;
    case 'tj-arch': { const t = tarjetaById(id); mutate(() => { t.archivada = !t.archivada; }); break; }
    case 'tj-del': { const t = tarjetaById(id), n = DB.gastos.filter(g => g.tarjeta === id).length;
      choose('¿Eliminar la tarjeta?', n ? `Tiene ${plural(n, 'gasto')} asociados. Los gastos no se borran: quedan como gastos sin tarjeta. Si solo dejaste de usarla, mejor archivala.` : 'No tiene gastos asociados.', [{ label: 'Eliminar tarjeta', value: 'ok' }, { label: 'Cancelar', value: 'cancel' }])
        .then(v => { if (v === 'ok') mutate(() => { DB.tarjetas = DB.tarjetas.filter(x => x !== t); DB.gastos.forEach(g => { if (g.tarjeta === id) delete g.tarjeta; }); }); }); break; }
    case 'g-edit': gastoDialog(id); break;
    case 'g-del': eliminarGasto(id); break;
    case 'i-edit': ingresoDialog(id); break;
    case 'i-del': { const idx = DB.ingresos.findIndex(x => x.id === id), it = DB.ingresos[idx]; mutate(() => DB.ingresos.splice(idx, 1)); toast('Ingreso eliminado: ' + it.desc, '', { label: 'Deshacer', fn: () => mutate(() => DB.ingresos.splice(idx, 0, it)) }); break; }
    case 'i-cobrado': { const it = DB.ingresos.find(x => x.id === id); mutate(() => { it.cobrado = el.checked; }); break; }
    case 'a-edit': ahorroDialog(id); break;
    case 'a-del': { const idx = DB.ahorros.findIndex(x => x.id === id), it = DB.ahorros[idx]; mutate(() => DB.ahorros.splice(idx, 1)); toast('Ahorro eliminado: ' + it.detalle, '', { label: 'Deshacer', fn: () => mutate(() => DB.ahorros.splice(idx, 0, it)) }); break; }
    case 'p-prev': UI.pStart = addMonths(UI.pStart || addMonths(UI.month, -1), -6); render(); break;
    case 'p-next': UI.pStart = addMonths(UI.pStart || addMonths(UI.month, -1), 6); render(); break;
    case 'cat-up': case 'cat-down': { const cs = catsOrdenadas(), i = cs.findIndex(c => c.id === id), j = act === 'cat-up' ? i - 1 : i + 1; if (j < 0 || j >= cs.length) break; mutate(() => { cs.forEach((c, k) => c.orden = k); const t = cs[i].orden; cs[i].orden = cs[j].orden; cs[j].orden = t; }); break; }
    case 'cat-arch': { const c = catById(id); mutate(() => { c.archivada = !c.archivada; }); break; }
    case 'tag-del': choose('¿Eliminar la etiqueta?', 'Se saca de todos los gastos que la tienen. Los gastos no se borran.', [{ label: 'Eliminar etiqueta', value: 'ok' }, { label: 'Cancelar', value: 'cancel' }]).then(v => { if (v === 'ok') mutate(() => { DB.etiquetas = DB.etiquetas.filter(t => t.id !== id); DB.gastos.forEach(g => { g.etiquetas = (g.etiquetas || []).filter(t => t !== id); }); }); }); break;
    case 'drive-connect': Drive.connect(); break;
    case 'drive-save': Drive.flush(); break;
    case 'drive-off': Drive.disconnect(); break;
    case 'informe': descargarInforme(); break;
    case 'export-json': download(`brujula-datos-${HOY}.json`, JSON.stringify(DB, null, 1)); break;
    case 'export-csv': exportCSV(el.dataset.k); break;
    case 'import-click': $('#file-import').click(); break;
    case 'start-empty': setDB(emptyDB()); render(); break;
    case 'wipe': choose('¿Borrar todo?', 'Se borran los datos guardados en este navegador. Si conectaste Drive, el archivo de Drive no se toca. Esta acción no se puede deshacer.', [{ label: 'Sí, borrar todo', value: 'ok' }, { label: 'Cancelar', value: 'cancel' }]).then(v => { if (v === 'ok') { try { localStorage.removeItem(LS_KEY); } catch (x) { } DB = normalizeDB({}); HAS_DATA = false; render(); toast('Datos borrados de este navegador.'); } }); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('.crow[role="link"]')) e.target.click();
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.matches?.('input,select,textarea') && !$('#dlg').open) { e.preventDefault(); if (UI.view !== 'inicio') go('inicio'); focusQA(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), kind = f.dataset.form;
  if (kind === 'qa') return submitQA(f);
  if (kind === 'ingreso') {
    const monto = parseMonto(fd.get('monto')); if (!(monto > 0)) { toast('El monto tiene que ser mayor a cero.', 'bad'); return; }
    mutate(() => DB.ingresos.push({ id: uid(), mes: UI.month, tipo: fd.get('tipo'), desc: fd.get('desc').trim(), monto, cobrado: fd.get('cobrado') === 'on', fecha: null }));
    toast('Ingreso agregado.');
  } else if (kind === 'ahorro') {
    const monto = parseMonto(fd.get('monto')); if (!(monto > 0)) { toast('El monto tiene que ser mayor a cero.', 'bad'); return; }
    const cot = parseMonto(fd.get('cot')), last = DB.ahorros[DB.ahorros.length - 1];
    mutate(() => DB.ahorros.push({ id: uid(), fecha: fd.get('fecha'), destino: fd.get('destino'), detalle: fd.get('detalle').trim(), monto, cotizacion: isNaN(cot) ? (last?.cotizacion ?? null) : cot }));
    toast('Ahorro agregado.');
  } else if (kind === 'cat-add') {
    const nombre = fd.get('nombre').trim(); if (!nombre) return;
    let id = slugify(nombre); while (catById(id)) id += '-2';
    mutate(() => DB.categorias.push({ id, nombre, orden: Math.max(-1, ...DB.categorias.map(c => c.orden)) + 1, archivada: false })); toast('Categoría agregada.');
  } else if (kind === 'tag-add') {
    const nombre = fd.get('nombre').trim(); if (!nombre) return;
    let id = slugify(nombre); while (tagById(id)) id += '-2';
    mutate(() => DB.etiquetas.push({ id, nombre })); toast('Etiqueta agregada.');
  } else if (kind === 'tj-add') {
    const nombre = fd.get('nombre').trim(), cierre = parseInt(fd.get('cierre')), vence = parseInt(fd.get('vence'));
    if (!nombre) return;
    if (!(cierre >= 1 && cierre <= 31 && vence >= 1 && vence <= 31)) { toast('Los días de cierre y vencimiento van del 1 al 31.', 'bad'); return; }
    const venceSig = fd.get('sig') !== '0';
    if (!venceSig && vence <= cierre) { toast('Si vence el mismo mes del cierre, el día de vencimiento tiene que ser posterior al de cierre.', 'bad'); return; }
    let id = 'tj-' + slugify(nombre); while (tarjetaById(id)) id += '-2';
    const nueva = { id, nombre, cierre, vence, venceSig, ajustes: {} };
    mutate(() => DB.tarjetas.push(nueva)); toast(`Tarjeta agregada: este mes ${ejemploFechas(nueva)}.`);
  } else if (kind === 'dest-add') {
    const nombre = fd.get('nombre').trim(); if (!nombre || DB.config.destinos.includes(nombre)) { toast('Ese destino ya existe.', 'bad'); return; }
    mutate(() => DB.config.destinos.push(nombre)); toast('Destino agregado.');
  }
});
// En los campos de monto, al salir se resuelve la cuenta (300000/6 → 50000)
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement) || !['monto', 'cot', 'cotHoy', 'montoTj'].includes(t.name) || !esCuenta(t.value)) return;
  const n = parseMonto(t.value);
  if (isNaN(n)) { toast('No pude resolver esa cuenta. Revisala.', 'bad'); return; }
  t.value = String(Math.round(n * 100) / 100).replace('.', ',');
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement) || t.id !== 'cot-hoy') return;
  const v = t.value.trim();
  if (!v) { mutate(() => { delete DB.config.cotHoy; }); return; }
  const n = parseMonto(v);
  if (!(n > 0)) { toast('Poné una cotización válida.', 'bad'); render(); return; }
  mutate(() => { DB.config.cotHoy = { valor: n, fecha: HOY }; }); toast('Cotización de hoy guardada.');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter === 'q') { UI.g.q = t.value; refocus = { sel: '#g-search', pos: t.selectionStart }; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'month-input') { if (/^\d{4}-\d{2}$/.test(t.value)) { UI.month = t.value; render(); } return; }
  if (t.dataset.filter && t.dataset.filter !== 'q') { UI.g[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; render(); return; }
  if (t.closest('form[data-form="qa"]')) {
    if (t.name === 'detalle') {
      const q = t.value.trim().toLowerCase();
      const last = [...DB.gastos].reverse().find(g => g.detalle.toLowerCase() === q);
      if (last) {
        const f = t.closest('form'); f.cat.value = last.cat; UI.qa.cat = last.cat;
        UI.qa.tags = (last.etiquetas || []).filter(x => x !== 'cuota'); UI.qa.ph = fmtNum(last.monto); f.monto.placeholder = UI.qa.ph; updateChips();
        const tjv = last.tarjeta && tarjetaById(last.tarjeta) && !tarjetaById(last.tarjeta).archivada ? last.tarjeta : '';
        if (!!tjv !== !!UI.qa.conTj || (tjv && tjv !== UI.qa.tj)) { snapQA(); UI.qa.conTj = !!tjv; if (tjv) UI.qa.tj = tjv; render(); $('#qa-monto')?.focus(); }
      }
    } else if (t.name === 'fecha' || t.name === 'cat') { UI.qa[t.name] = t.value; }
    return;
  }
  if (t.classList.contains('cell')) {
    const v = t.value.trim();
    if (t.dataset.meta) {
      const m = t.dataset.meta;
      if (v === '') mutate(() => { delete DB.metaAhorro[m]; }, false);
      else { const n = parseMonto(v); if (isNaN(n) || n < 0) { toast('Poné un número válido.', 'bad'); t.value = DB.metaAhorro[m] != null ? fmtNum(DB.metaAhorro[m]) : ''; return; } mutate(() => { DB.metaAhorro[m] = n; }, false); t.value = fmtNum(n); }
    } else {
      const m = t.dataset.m, c = t.dataset.c;
      if (v === '') mutate(() => { if (DB.presupuestos[m]) { delete DB.presupuestos[m][c]; if (!Object.keys(DB.presupuestos[m]).length) delete DB.presupuestos[m]; } }, false);
      else { const n = parseMonto(v); if (isNaN(n) || n < 0) { toast('Poné un número válido.', 'bad'); const ex = presupuestoExplicito(m, c); t.value = ex != null ? fmtNum(ex) : ''; return; } mutate(() => { (DB.presupuestos[m] = DB.presupuestos[m] || {})[c] = n; }, false); t.value = fmtNum(n); }
    }
    refreshPres(); return;
  }
  const cfg = t.dataset.cfg; if (!cfg) return;
  const v = t.value.trim();
  if (cfg === 'clientId') { Drive.clientId = v; Drive.tc = null; Drive.lsSet('brujula:clientId', v); toast('ID de cliente guardado.'); }
  else if (cfg === 'primerMes') { if (/^\d{4}-\d{2}$/.test(v)) mutate(() => { DB.config.primerMes = v; }); }
  else if (cfg === 'cat-name') { if (!v) { render(); return; } mutate(() => { catById(t.dataset.id).nombre = v; }); toast('Categoría renombrada en todo el historial.'); }
  else if (cfg === 'tj-name') { if (!v) { render(); return; } mutate(() => { tarjetaById(t.dataset.id).nombre = v; }); }
  else if (cfg === 'tj-cierre' || cfg === 'tj-vence' || cfg === 'tj-sig') {
    const tj = tarjetaById(t.dataset.id), prueba = { ...tj, venceSig: venceMesSig(tj) };
    if (cfg === 'tj-sig') prueba.venceSig = v === '1';
    else { const n = parseInt(v); if (!(n >= 1 && n <= 31)) { toast('Poné un día del 1 al 31.', 'bad'); render(); return; } prueba[cfg === 'tj-cierre' ? 'cierre' : 'vence'] = n; }
    if (!prueba.venceSig && prueba.vence <= prueba.cierre) { toast('Si vence el mismo mes del cierre, el día de vencimiento tiene que ser posterior al de cierre.', 'bad'); render(); return; }
    mutate(() => { tj.cierre = prueba.cierre; tj.vence = prueba.vence; tj.venceSig = prueba.venceSig; });
    toast(`Guardado: este mes ${ejemploFechas(tj)}.`);
  }
  else if (cfg === 'tag-name') { if (!v) { render(); return; } mutate(() => { tagById(t.dataset.id).nombre = v; }); }
  else if (cfg === 'dest-name') {
    const i = Number(t.dataset.i), old = DB.config.destinos[i];
    if (!v || (v !== old && DB.config.destinos.includes(v))) { render(); toast('Ese nombre no es válido o ya existe.', 'bad'); return; }
    mutate(() => { DB.config.destinos[i] = v; DB.ahorros.forEach(a => { if (a.destino === old) a.destino = v; }); });
  }
});
$('#file-import').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.gastos) || !Array.isArray(d.categorias)) throw new Error('El archivo no tiene el formato esperado (faltan gastos o categorías).');
    if (HAS_DATA && (DB.gastos.length || DB.ingresos.length)) {
      const v = await choose('¿Reemplazar los datos actuales?', `El archivo trae ${d.gastos.length} gastos. Los datos actuales de este navegador se reemplazan por completo.`, [{ label: 'Reemplazar con el archivo', value: 'ok' }, { label: 'Cancelar', value: 'cancel' }]);
      if (v !== 'ok') return;
    }
    setDB(d); render(); toast(`Datos importados: ${d.gastos.length} gastos, ${(d.ingresos || []).length} ingresos, ${(d.ahorros || []).length} ahorros.`);
  } catch (err) { toast('No se pudo importar: ' + err.message, 'bad'); }
});

/* ============ Modo claro / oscuro ============ */
function setTema(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('brujula:tema', t); } catch (e) { }
  document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', t);
  const b = $('#tema-btn'); if (b) { b.setAttribute('aria-label', t === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'); b.title = b.getAttribute('aria-label'); }
  if (UI.view === 'analisis') render();
}
/* ============ Inicio de la app ============ */
(function init() {
  const local = loadLocal();
  if (local) { DB = local; HAS_DATA = true; } else { DB = normalizeDB({}); HAS_DATA = false; }
  $('#nav').innerHTML = NAV.map(([k, t]) => `<a href="#/${k}" data-view="${k}">${ic(k)}<span>${t}</span></a>`).join('');
  Drive.init();
  setTema(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  route();
})();
</script>
</body>
